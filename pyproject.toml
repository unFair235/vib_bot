[tool.poetry]
name = "vib-bot"
version = "0.1.0"
description = "Real-time VIB coin volatility analysis & signal pipeline"
authors = ["Igor Bulgakov <igor@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.0"
numpy = "^1.24"
scikit-learn = "^1.3"
tensorflow = "^2.12"
ta = "^0.11.0"             # ← pin to the latest published version
websocket-client = "^1.6"
requests = "^2.31"
joblib = "^1.3"
pytest = "^7.3"

[tool.poetry.dev-dependencies]
black               = "^23.3"
flake8              = "^6.0"

[build-system]
requires            = ["poetry-core"]
build-backend        = "poetry.core.masonry.api"