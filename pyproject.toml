[tool.poetry]
name        = "vib-bot"
version     = "0.1.0"
description = "ML‑driven real‑time crypto volatility signal & execution pipeline"
authors     = ["Igor Bulgakov <igor@example.com>"]
license     = "MIT"

# package your vib_bot/ folder as the Python library
packages = [
  { include = "vib_bot", from = "." }
]

[tool.poetry.dependencies]
python            = "^3.9"
pandas            = "^2.0"
numpy             = "^1.24"
scikit-learn      = "^1.3"
tensorflow        = "^2.12"
ta                = "^0.11.0"
websocket-client  = "^1.6"
requests          = "^2.31"
joblib            = "^1.3"

[tool.poetry.group.dev.dependencies]
pytest            = "^7.4"
black             = "^23.12.1"
flake8            = "^6.1"

[build-system]
requires       = ["poetry-core"]
build-backend  = "poetry.core.masonry.api"